<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇屏保 + BFS最短路径</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
  }
  #fullscreenBtn {
    position: fixed;
    bottom: 12px;
    left: 12px;
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    z-index: 999;
    backdrop-filter: blur(2px);
    user-select: none;
    transition: 0.3s;
  }
  #fullscreenBtn:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<button id="fullscreenBtn">⛶</button>

<script>
  // ============================================================
  // 屏保配置
  // ============================================================
  const GRID = 16;
  const DELAY = 70;
  const WRAP = true;
  const FORCE_FOOD_INTERVAL = 8000;
  const INIT_SNAKE = [[3,3],[3,4],[3,5]];

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let cellSize = 0;
  let cols = GRID, rows = GRID;

  // ============================================================
  // 游戏状态
  // ============================================================
  let snake = [];
  let direction = [0, 1];
  let food = null;
  let lastAteTime = 0;
  let running = true;
  let lastMove = 0;

  // ============================================================
  // 初始化
  // ============================================================
  function init() {
    snake = INIT_SNAKE.map(p => [p[0], p[1]]);
    direction = [0, 1];
    spawnFood();
    lastAteTime = performance.now();
  }

  function spawnFood() {
    const set = new Set(snake.map(p => `${p[0]},${p[1]}`));
    const empty = [];
    for (let r=0; r<rows; r++)
      for (let c=0; c<cols; c++)
        if (!set.has(`${r},${c}`)) empty.push([r,c]);
    if (empty.length === 0) { init(); return; }
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  function forceFoodNearHead() {
    const head = snake[snake.length-1];
    const dirs = [
      direction,
      [direction[1], -direction[0]],
      [-direction[1], direction[0]],
      [-direction[0], -direction[1]]
    ];
    for (const [dr, dc] of dirs) {
      const pos = wrap([head[0] + dr, head[1] + dc]);
      if (isValid(pos, snake)) {
        food = pos;
        return;
      }
    }
    const set = new Set(snake.map(p => `${p[0]},${p[1]}`));
    const empty = [];
    for (let r=0; r<rows; r++)
      for (let c=0; c<cols; c++)
        if (!set.has(`${r},${c}`)) empty.push([r,c]);
    if (empty.length > 0) food = empty[Math.floor(Math.random() * empty.length)];
    else init();
  }

  function wrap(p) {
    let [r,c] = p;
    if (WRAP) {
      r = ((r % rows) + rows) % rows;
      c = ((c % cols) + cols) % cols;
    }
    return [r,c];
  }

  function isValid(p, snakeArr) {
    const [r,c] = p;
    const set = new Set(snakeArr.map(p => `${p[0]},${p[1]}`));
    if (WRAP) return !set.has(`${r},${c}`);
    return r>=0 && r<rows && c>=0 && c<cols && !set.has(`${r},${c}`);
  }

  // ============================================================
  // Python 风格 BFS 最短路径算法
  // ============================================================
  
  /**
   * BFS 寻路：从起点到终点的最短路径
   * 返回：路径数组（从起点到终点），如果不可达则返回 null
   */
  function bfsShortestPath(start, target, snakeArr) {
    if (start[0] === target[0] && start[1] === target[1]) {
      return [start];
    }

    const queue = [[start[0], start[1]]];
    const visited = new Set();
    visited.add(`${start[0]},${start[1]}`);
    const parent = new Map(); // 记录路径

    const dirs = [
      [-1, 0], // 上
      [0, -1], // 左
      [0, 1],  // 右
      [1, 0]   // 下
    ];

    while (queue.length > 0) {
      const [r, c] = queue.shift();
      
      // 到达目标
      if (r === target[0] && c === target[1]) {
        // 重建路径
        const path = [];
        let current = [r, c];
        while (current) {
          path.unshift([current[0], current[1]]);
          const key = `${current[0]},${current[1]}`;
          if (key === `${start[0]},${start[1]}`) break;
          current = parent.get(key);
        }
        return path;
      }

      // 探索相邻节点
      for (const [dr, dc] of dirs) {
        const nr = ((r + dr) % rows + rows) % rows;
        const nc = ((c + dc) % cols + cols) % cols;
        const key = `${nr},${nc}`;
        const pos = [nr, nc];

        // 检查是否可访问（不是蛇身，或者就是目标点）
        const isSnakeBody = snakeArr.some(p => p[0] === nr && p[1] === nc);
        const isTarget = nr === target[0] && nc === target[1];
        
        if (!visited.has(key) && (isTarget || !isSnakeBody)) {
          visited.add(key);
          queue.push([nr, nc]);
          parent.set(key, [r, c]);
        }
      }
    }

    // 无法到达
    return null;
  }

  /**
   * 检查路径是否安全（路径上的点不会被蛇身挡住）
   * 实际上是检查路径上的每个点（除了终点）是否在蛇身上
   */
  function isPathSafe(path, snakeArr) {
    if (!path || path.length === 0) return false;
    // 检查路径中间的点（不含起点和终点）
    for (let i = 1; i < path.length - 1; i++) {
      const [r, c] = path[i];
      // 检查是否在蛇身上（终点除外）
      if (snakeArr.some(p => p[0] === r && p[1] === c)) {
        return false;
      }
    }
    return true;
  }

  /**
   * AI 决策：BFS 最短路径 + 安全检查
   * 严格按照 Python 实现
   */
  function aiMove() {
    const head = snake[snake.length - 1];
    const cur = direction;
    const opp = [-cur[0], -cur[1]];
    const dirs = [
      [-1, 0], // 上
      [0, -1], // 左
      [0, 1],  // 右
      [1, 0]   // 下
    ];

    // ---- 1. 如果食物存在，计算最短路径 ----
    if (food) {
      const path = bfsShortestPath(head, food, snake);
      
      // 检查路径是否安全（没有障碍物）
      if (path && path.length > 0) {
        // 路径安全：走第一步
        const nextPos = path[1]; // path[0] 是当前位置
        if (nextPos) {
          const dr = nextPos[0] - head[0];
          const dc = nextPos[1] - head[1];
          // 修正穿墙方向
          let finalDr = dr, finalDc = dc;
          if (dr > rows/2) finalDr = dr - rows;
          else if (dr < -rows/2) finalDr = dr + rows;
          if (dc > cols/2) finalDc = dc - cols;
          else if (dc < -cols/2) finalDc = dc + cols;
          // 确保不是反向
          if (finalDr !== -opp[0] || finalDc !== -opp[1]) {
            return [finalDr, finalDc];
          }
        }
      }
    }

    // ---- 2. 无法直接到达食物，选择空间最大的方向 ----
    const scored = [];
    for (const [dr, dc] of dirs) {
      if (dr === opp[0] && dc === opp[1]) continue;
      const np = wrap([head[0] + dr, head[1] + dc]);
      if (!isValid(np, snake)) continue;

      // 模拟走一步
      const newSnake = [...snake.slice(1), np];
      const space = countAccessible(np, newSnake);
      let score = space;

      // 方向偏好
      if (dr === cur[0] && dc === cur[1]) {
        score -= 15;
      } else if (dr === cur[1] && dc === -cur[0]) {
        score += 8;
      } else if (dr === -cur[1] && dc === cur[0]) {
        score += 8;
      }

      scored.push({ dir: [dr, dc], score });
    }

    if (!scored.length) return cur;
    scored.sort((a, b) => b.score - a.score);
    const maxScore = scored[0].score;
    const best = scored.filter(item => item.score === maxScore);
    const chosen = best[Math.floor(Math.random() * best.length)];
    return chosen.dir;
  }

  /**
   * 计算可达空间（BFS 洪水填充）
   */
  function countAccessible(start, snakeArr) {
    const visited = new Set(snakeArr.map(p => `${p[0]},${p[1]}`));
    const q = [[start[0], start[1]]];
    const sk = `${start[0]},${start[1]}`;
    if (visited.has(sk)) visited.delete(sk);
    let count = 0;
    while (q.length) {
      const [r,c] = q.shift();
      const key = `${r},${c}`;
      if (visited.has(key)) continue;
      visited.add(key);
      count++;
      for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const np = wrap([r+dr, c+dc]);
        const nk = `${np[0]},${np[1]}`;
        if (!visited.has(nk) && isValid(np, snakeArr)) q.push(np);
      }
    }
    return count;
  }

  // ============================================================
  // 游戏步进
  // ============================================================
  function step() {
    if (!running) return;

    const now = performance.now();
    if (now - lastAteTime > FORCE_FOOD_INTERVAL) {
      forceFoodNearHead();
      lastAteTime = now;
    }

    const dir = aiMove();
    direction = dir;
    const head = snake[snake.length-1];
    const newHead = wrap([head[0]+dir[0], head[1]+dir[1]]);

    if (food && newHead[0]===food[0] && newHead[1]===food[1]) {
      snake.push([newHead[0], newHead[1]]);
      lastAteTime = now;
      spawnFood();
      if (!food) { init(); return; }
    } else {
      snake.push([newHead[0], newHead[1]]);
      snake.shift();
    }

    const headKey = `${newHead[0]},${newHead[1]}`;
    const bodyKeys = snake.slice(0, -1).map(p => `${p[0]},${p[1]}`);
    if (bodyKeys.includes(headKey)) {
      forceFoodNearHead();
      lastAteTime = performance.now();
      init();
      return;
    }
  }

  // ============================================================
  // 绘制（全屏自适应，蛇身缩小 + 圆角）
  // ============================================================
  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, w, h);

    // 网格线
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 0.3;
    for (let i=0; i<=cols; i++) {
      ctx.beginPath();
      ctx.moveTo(i*cellSize, 0);
      ctx.lineTo(i*cellSize, h);
      ctx.stroke();
    }
    for (let i=0; i<=rows; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i*cellSize);
      ctx.lineTo(w, i*cellSize);
      ctx.stroke();
    }

    // 食物
    if (food) {
      const [fr,fc] = food;
      ctx.beginPath();
      ctx.arc(fc*cellSize+cellSize/2, fr*cellSize+cellSize/2, cellSize*0.3, 0, 2*Math.PI);
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#ff444488';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 蛇身
    const len = snake.length;
    const shrink = 0.85;
    const offset = cellSize * (1 - shrink) / 2;
    for (let i=0; i<len; i++) {
      const [r,c] = snake[i];
      const x = c * cellSize + offset;
      const y = r * cellSize + offset;
      const size = cellSize * shrink;
      let color;
      if (i === len-1) {
        color = '#ffffff';
      } else {
        const hue = 50 + (i / Math.max(len-1,1)) * 240;
        color = `hsl(${hue}, 90%, 60%)`;
      }
      ctx.fillStyle = color;
      ctx.shadowColor = (i===len-1) ? '#ffffff66' : color+'66';
      ctx.shadowBlur = (i===len-1) ? 16 : 4;
      const radius = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + size, y, x + size, y + size, radius);
      ctx.arcTo(x + size, y + size, x, y + size, radius);
      ctx.arcTo(x, y + size, x, y, radius);
      ctx.arcTo(x, y, x + size, y, radius);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // ============================================================
  // 循环
  // ============================================================
  function loop() {
    const now = performance.now();
    
    // 移动逻辑
    if (now - lastMove > DELAY) {
    step();
    lastMove = now;
    }
    
    // 绘制
    draw();
    
    // 用 setTimeout 代替 requestAnimationFrame
    // 间隔设为 DELAY，既控制速度又降低 CPU
    setTimeout(loop, 100);
  }

  // ============================================================
  // 尺寸自适应
  // ============================================================
  function resizeCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    const density = Math.max(12, Math.min(24, Math.floor(w / 50)));
    cols = density;
    rows = Math.floor(density * (h / w));
    cellSize = Math.min(w / cols, h / rows) * 0.6;
    cols = Math.floor(w / cellSize);
    rows = Math.floor(h / cellSize);
    init();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ============================================================
  // 左下角全屏按钮
  // ============================================================
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // ============================================================
  // 启动
  // ============================================================
  init();
  requestAnimationFrame(loop);
</script>
</body>
</html>
