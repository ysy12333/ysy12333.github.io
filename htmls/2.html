<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寸金难买寸光阴    吗？</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            position: relative;
            background-color: #ffffff;
            border: 1px solid #ccc;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #000000;
            margin: 40px 0 60px 0;
        }
        
        .button-container {
            display: flex;
            justify-content: space-between;
            margin: 40px 0;
            gap: 20px;
        }
        
        .button {
            flex: 1;
            max-width: 300px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid #000000;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            background-color: #64c864;
        }
        
        .button:hover {
            background-color: #96ff96 !important;
        }
        
        .counter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0;
            gap: 20px;
        }
        
        .counter {
            font-size: 36px;
            color: #000000;
            text-align: center;
        }
        
        .animation {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s;
            z-index: 1000;
        }
        
        .animation.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">寸金难买寸光阴    吗？</div>
        
        <div class="button-container">
            <div id="button1" class="button">点击获取寸金</div>
            <div id="button2" class="button">点击购买寸光阴</div>
        </div>
        
        <div class="counter-container">
            <div id="counter1" class="counter">寸金拥有数: 0</div>
            <div id="counter2" class="counter">寸光阴拥有数: 0</div>
        </div>
    </div>

    <script>
        // 全局变量
        let guangyin = 0;
        let count = 0;
        let animations = [];

        // 获取DOM元素
        const button1 = document.getElementById('button1');
        const button2 = document.getElementById('button2');
        const counter1 = document.getElementById('counter1');
        const counter2 = document.getElementById('counter2');
        const container = document.querySelector('.container');

        // 文字动画类
        class TextAnimation {
            constructor(text, color, startPos, targetPos, duration = 800, displayTime = 1000, fadeOutTime = 500) {
                this.text = text;
                this.color = color;
                this.startPos = startPos;
                this.targetPos = targetPos;
                this.duration = duration;
                this.displayTime = displayTime;
                this.fadeOutTime = fadeOutTime;
                
                this.startTime = Date.now();
                this.state = 'entering';
                this.alpha = 1;
                this.currentPos = [...startPos];
                
                this.createElement();
            }
            
            createElement() {
                this.element = document.createElement('div');
                this.element.className = 'animation';
                this.element.textContent = this.text;
                this.element.style.color = this.color;
                this.element.style.position = 'absolute';
                this.element.style.left = this.currentPos[0] + 'px';
                this.element.style.top = this.currentPos[1] + 'px';
                this.element.style.opacity = this.alpha;
                container.appendChild(this.element);
            }
            
            update() {
                const currentTime = Date.now();
                const elapsed = currentTime - this.startTime;
                
                if (this.state === 'entering') {
                    const progress = Math.min(elapsed / this.duration, 1);
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    
                    const dx = this.targetPos[0] - this.startPos[0];
                    const dy = this.targetPos[1] - this.startPos[1];
                    this.currentPos[0] = this.startPos[0] + dx * easeProgress;
                    this.currentPos[1] = this.startPos[1] + dy * easeProgress;
                    
                    this.element.style.left = this.currentPos[0] + 'px';
                    this.element.style.top = this.currentPos[1] + 'px';
                    
                    if (progress >= 1) {
                        this.state = 'displaying';
                        this.startTime = currentTime;
                    }
                } else if (this.state === 'displaying') {
                    if (elapsed >= this.displayTime) {
                        this.state = 'exiting';
                        this.startTime = currentTime;
                    }
                } else if (this.state === 'exiting') {
                    const progress = Math.min(elapsed / this.fadeOutTime, 1);
                    this.alpha = 1 - progress;
                    this.element.style.opacity = this.alpha;
                    
                    if (progress >= 1) {
                        this.state = 'finished';
                        this.element.remove();
                    }
                }
            }
            
            isFinished() {
                return this.state === 'finished';
            }
        }

        // 获取元素在容器内的绝对位置
        function getElementPositionInContainer(element) {
            const rect = element.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            return {
                x: rect.left - containerRect.left + rect.width / 2,
                y: rect.top - containerRect.top + rect.height / 2
            };
        }

        // 按钮1点击事件
        function buttonAction() {
            count += 1;
            counter1.textContent = `寸金拥有数: ${count}`;
            console.log('count+1');
            
            // 获取按钮和计数器的位置
            const button1Pos = getElementPositionInContainer(button1);
            const counter1Pos = getElementPositionInContainer(counter1);
            
            // 添加寸金+1动画
            const anim = new TextAnimation(
                '寸金 +1',
                '#0096c8',
                [button1Pos.x, button1Pos.y + 80],
                [button1Pos.x, button1Pos.y + 30],
                800,
                1000,
                500
            );
            animations.push(anim);
        }

        // 按钮2点击事件
        function buttonActionB() {
            if (count > 0) {
                if (Math.random() < 0.1) {
                    guangyin += 1;
                    count -= 1;
                    counter1.textContent = `寸金拥有数: ${count}`;
                    counter2.textContent = `寸光阴拥有数: ${guangyin}`;
                    console.log('guangyin+1,count-1');
                    
                    // 获取按钮和计数器的位置
                    const button2Pos = getElementPositionInContainer(button2);
                    const counter2Pos = getElementPositionInContainer(counter2);
                    
                    // 添加购买成功动画
                    const anim = new TextAnimation(
                        '寸光阴购买成功',
                        '#009600',
                        [button2Pos.x - 50, button2Pos.y + 80],
                        [button2Pos.x - 50, button2Pos.y + 30],
                        800,
                        1000,
                        500
                    );
                    animations.push(anim);
                } else {
                    count -= 1;
                    counter1.textContent = `寸金拥有数: ${count}`;
                    console.log('count-1');
                    
                    // 获取按钮位置
                    const button2Pos = getElementPositionInContainer(button2);
                    
                    // 添加购买失败动画
                    const anim = new TextAnimation(
                        '寸光阴购买失败',
                        '#c80000',
                        [button2Pos.x - 50, button2Pos.y + 150],
                        [button2Pos.x - 50, button2Pos.y + 100],
                        800,
                        1000,
                        500
                    );
                    animations.push(anim);
                }
            } else {
                // 获取按钮位置
                const button2Pos = getElementPositionInContainer(button2);
                
                // 添加寸金不足动画
                const anim = new TextAnimation(
                    '寸金不足，请先获得寸金',
                    '#c86400',
                    [button2Pos.x - 50, button2Pos.y + 250],
                    [button2Pos.x - 50, button2Pos.y + 200],
                    800,
                    1000,
                    500
                );
                animations.push(anim);
            }
        }

        // 事件监听
        button1.addEventListener('click', buttonAction);
        button2.addEventListener('click', buttonActionB);

        // 动画循环
        function updateAnimations() {
            for (let i = animations.length - 1; i >= 0; i--) {
                animations[i].update();
                if (animations[i].isFinished()) {
                    animations.splice(i, 1);
                }
            }
            requestAnimationFrame(updateAnimations);
        }

        // 启动动画循环
        updateAnimations();
    </script>
</body>
</html>
