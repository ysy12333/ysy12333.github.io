name: 自动更新时间并部署

on:
  push:
    branches:
      - main

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5                     # 防卡死，5分钟超时自动终止
    # 跳过自动提交触发的运行，避免死循环
    if: "!contains(github.event.head_commit.message, 'chore: 自动更新时间')"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查占位符是否存在（安全校验）
        run: |
          if ! grep -q "{{UPDATE_TIME}}" index.html; then
            echo "⚠️ 警告：index.html 里没有找到 {{UPDATE_TIME}} 占位符，将跳过替换。"
          else
            echo "✅ 占位符存在，准备替换。"
          fi

      - name: 注入北京时间
        run: |
          DATE=$(date '+%Y年%m月%d日，%A' -d '+8 hours')
          sed -i "s/{{UPDATE_TIME}}/$DATE/g" index.html
          echo "✅ 时间已更新为：$DATE"

      - name: 部署到 main 分支（安全覆盖）
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./                   # 把整个仓库根目录的文件部署上去
          publish_branch: main              # 直接推送到 main 分支
          force_orphan: false               # 不强制孤儿提交，保留历史
          keep_files: true                  # 保留 main 分支里其他未覆盖的文件
          commit_message: 'chore: 自动更新时间'   # 自定义提交信息，用于跳过触发