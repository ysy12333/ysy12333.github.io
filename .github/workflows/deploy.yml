name: 自动更新时间

on:
  push:
    branches:
      - main

jobs:
  update-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 跳过自动提交触发的运行，避免死循环
    if: "!contains(github.event.head_commit.message, 'chore: 自动更新时间')"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查占位符是否存在
        run: |
          if ! grep -q "{{UPDATE_TIME}}" index.html; then
            echo "⚠️ 警告：index.html 里没有找到 {{UPDATE_TIME}} 占位符！"
            echo "请检查 HTML 文件是否正确。"
            exit 0
          fi
          echo "✅ 占位符存在"

      - name: 注入北京时间
        run: |
          DATE=$(date '+%Y年%m月%d日，%A' -d '+8 hours')
          sed -i "s/{{UPDATE_TIME}}/$DATE/g" index.html
          echo "✅ 时间已更新为：$DATE"

      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: 自动更新时间"
          git push