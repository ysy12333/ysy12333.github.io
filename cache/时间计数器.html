<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .time-display {
            font-size: 36px;
            margin: 40px 0;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #111;
        }
        
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: "SimSun", "宋体", serif;
        }
        
        button:hover {
            background-color: #333;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .settings {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #111;
        }
        
        .settings input {
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            width: 100px;
            text-align: center;
            font-size: 16px;
        }
        
        .instructions {
            font-size: 16px;
            margin-top: 30px;
            color: #aaa;
            line-height: 1.6;
        }
        
        .log-container {
            margin-top: 30px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background-color: #111;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #333;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            color: #ccc;
        }
        
        .log-timestamp {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>时间计数器</h1>
        
        <div class="settings">
            <label for="timeUnit">时间单位长度 (分钟):</label>
            <input type="number" id="timeUnit" min="1" max="60" value="5">
            <button id="setUnitBtn">设置</button>
        </div>
        
        <div class="time-display">
            当前时间：<span id="hour">0</span>时 <span id="minute">0</span>分
        </div>
        
        <div class="control-buttons">
            <button id="addBtn">+ 增加</button>
            <button id="subtractBtn">- 减少</button>
            <button id="resetBtn">R 重置</button>
        </div>
        
        <div class="instructions">
            点击"+"增加时间，点击"-"减少时间，点击"R"重置，按Esc键退出<br>
            时间单位可在上方设置（1-60分钟）
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="log-entry"><span class="log-timestamp">[系统]</span> 时间计数器已启动</div>
        </div>
    </div>

    <script>
        // 初始化变量
        let hour = 0;
        let minute = 0;
        let timeUnit = 5; // 默认时间单位
        
        // 获取DOM元素
        const hourElement = document.getElementById('hour');
        const minuteElement = document.getElementById('minute');
        const timeUnitInput = document.getElementById('timeUnit');
        const setUnitBtn = document.getElementById('setUnitBtn');
        const addBtn = document.getElementById('addBtn');
        const subtractBtn = document.getElementById('subtractBtn');
        const resetBtn = document.getElementById('resetBtn');
        const logContainer = document.getElementById('logContainer');
        
        // 设置时间单位
        setUnitBtn.addEventListener('click', () => {
            const newUnit = parseInt(timeUnitInput.value);
            if (isNaN(newUnit) || newUnit <= 0 || newUnit > 60) {
                addLog('错误', '请输入1~60之间的整数');
                alert('请输入1~60之间的整数');
                return;
            }
            timeUnit = newUnit;
            addLog('设置', `时间单位已设置为 ${timeUnit} 分钟`);
        });
        
        // 增加时间
        addBtn.addEventListener('click', () => {
            minute += timeUnit;
            if (minute >= 60) {
                hour += 1;
                minute -= 60;
            }
            updateDisplay();
            addLog('操作', `增加了 ${timeUnit} 分钟`);
        });
        
        // 减少时间
        subtractBtn.addEventListener('click', () => {
            if (minute >= timeUnit) {
                minute -= timeUnit;
            } else {
                if (hour > 0) {
                    hour -= 1;
                    minute = minute + 60 - timeUnit;
                } else {
                    minute = 0;
                }
            }
            updateDisplay();
            addLog('操作', `减少了 ${timeUnit} 分钟`);
        });
        
        // 重置时间
        resetBtn.addEventListener('click', () => {
            hour = 0;
            minute = 0;
            updateDisplay();
            addLog('操作', '计数器已重置');
        });
        
        // 更新显示
        function updateDisplay() {
            hourElement.textContent = hour;
            minuteElement.textContent = minute;
        }
        
        // 添加日志
        function addLog(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-timestamp">[${timestamp} - ${type}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // 同时输出到控制台
            console.log(`[${type}] ${message}`);
        }
        
        // Esc键退出功能
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                addLog('系统', '程序已退出');
                setTimeout(() => {
                    alert('按Esc退出功能在网页版中不可用，请直接关闭浏览器标签页');
                }, 100);
            }
        });
        
        // 初始化
        addLog('系统', '时间计数器初始化完成');
    </script>
</body>
</html>
