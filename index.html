<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%);
            min-height: 100vh;
            display: block;
            padding: 0;
            color: #333;
        }
        
        .file-manager {
            width: 100%;
            max-width: none;
            background: white;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .main-content {
            padding: 30px 25px;
        }
        
        .file-list {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
            text-decoration: none;
            color: inherit;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-item:hover {
            background: #f8f9fa;
        }
        
        .file-icon {
            width: 40px;
            height: 40px;
            background: #4b7bec;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: white;
            font-size: 1.2rem;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .file-desc {
            font-size: 0.85rem;
            color: #6c757d;
        }
        
        .file-meta {
            text-align: right;
            font-size: 0.85rem;
            color: #6c757d;
        }
        
        .footer {
            padding: 15px 25px;
            background: #f8f9fa;
            text-align: center;
            color: #6c757d;
            font-size: 0.85rem;
            border-top: 1px solid #e9ecef;
        }
        
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.3rem;
            }
            
            .current-path {
                margin: 0;
            }
            
            .main-content {
                padding: 20px 15px;
            }
            
            .file-item {
                padding: 12px;
            }
            
            .footer {
                padding: 12px 15px;
            }

            .file_name_s {
                font-size: 12px;
                color: grey
            }
        }
    </style>
</head>
