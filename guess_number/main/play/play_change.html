<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字 - 手动指定范围</title>
    <style>
        .s_title,.range {
            text-align: center;
        }
        .guess,#check {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="setting" id="setting">
        <h1 class="s_title">猜数字多人游戏</h1>
    </div>
    <div id="play" class="play">
        <h2 class="s_title">开始猜数字吧！</h2>
        <input type="number" id="guess" class="guess" placeholder="请输入要猜的数字">
        <br><br>
        <button id="check">猜</button>
        <p id="show"></p>
    </div>
    <script>
        const guess = document.getElementById('guess');
        const check = document.getElementById('check');
        const show = document.getElementById('show');

        const data = new URLSearchParams(window.location.search);
        const max = parseInt(data.get('max'));
        const min = parseInt(data.get('min'));
        const num = parseInt(data.get('num'))
        


        guess.addEventListener('input', function() {
            guess.value = guess.value.replace(/[^0-9]/g, '');
        });

        

        let guess_max = max;
        let guess_min = min;
        check.addEventListener('click', function() {
            const guess_num = parseInt(guess.value);
            if (guess_num > max || guess_num < min) {
                show.textContent = `请在${min}~${max}内猜`;
                return;
            }
            if (guess_num > num) {
                show.textContent = `猜的太大了，${guess_min}-${guess_num}`;
                guess_max = guess_num;
            };
            if (guess_num < num) {
                show.textContent = `猜的太小了，${guess_num}-${guess_max}`;
                guess_min = guess_num;
            };
            if (guess_num === num) {
                show.textContent = `猜中了！`;
            };
        });
    </script>
</body>
</html>
